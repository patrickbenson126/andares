<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andares — with Pat</title>
<meta name="description" content="Andares (wandering) — a spatial journal from Guatemala, with Pat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root{
    --sky:#8fc4e8; --haze:#bfe0f2; --cloud:#fbfaf3;
    --ink:#1f3d2e;         /* pine — primary text */
    --ink-soft:#4a6353;
    --ink-faint:#7c9184;
    --emerald:#2e7d5b;
    --sage:#6a9a5b;
    --marigold:#e0a530; --clay:#c96f3a; --coral:#d98e78;
    --line:rgba(31,61,46,.14);
    --card:rgba(251,250,243,.82);
    --accent:var(--emerald);   /* house accent; per-post color overrides locally */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Bitter",Georgia,serif;color:var(--ink);
    background:linear-gradient(#8fc4e8 0%,#bfe0f2 22%,#e4f1f4 46%,#fbfaf3 72%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--emerald);outline-offset:3px;border-radius:2px}

  #app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;height:100vh}

  /* ---------- Reading side ---------- */
  #feed{overflow-y:auto;position:relative}
  .masthead{padding:44px 46px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .masthead .titles{flex:1;min-width:220px}
  .masthead h1{
    margin:0;font-size:40px;font-weight:700;line-height:1;letter-spacing:-.015em;color:var(--ink);
  }
  .masthead h1 .gloss{font-weight:400;font-style:italic;font-size:23px;color:var(--emerald);letter-spacing:0}
  .masthead .byline{margin:10px 0 0;font-size:15px;font-style:italic;color:var(--ink-soft);display:flex;align-items:center;gap:9px}
  .portrait{
    width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;
    box-shadow:0 0 0 3px var(--cloud),0 3px 10px rgba(31,61,46,.22);
  }
  .rule{height:1px;background:var(--line);margin:0 46px}

  .posts{list-style:none;margin:0;padding:8px 0 80px}
  .post{padding:26px 46px;cursor:pointer;position:relative;transition:background .2s ease}
  .post + .post{border-top:1px solid var(--line)}
  .post:hover,.post:focus-within{background:rgba(251,250,243,.5)}
  .post.active{background:rgba(251,250,243,.78)}
  .post.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--accent))}
  .post .meta{font-size:12.5px;letter-spacing:.04em;color:var(--ink-faint);margin:0 0 8px;font-weight:500}
  .post .meta .place{color:var(--pc,var(--emerald));font-weight:600}
  .post h2{margin:0 0 10px;font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
  .post .excerpt{margin:0;font-size:16px;line-height:1.62;color:var(--ink-soft);max-width:48ch}

  /* revealed body */
  .post .body{max-height:0;overflow:hidden;opacity:0;
    transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .35s ease,margin .35s ease;
    font-size:16.5px;line-height:1.72;color:var(--ink);max-width:48ch}
  .post.active .body{max-height:1600px;opacity:1;margin:16px 0 2px}
  .post .body p{margin:0 0 1em}
  .post .body img.photo{width:100%;border-radius:6px;margin:6px 0 14px;box-shadow:0 6px 20px rgba(31,61,46,.16)}
  .post .substack{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;
    font-style:italic;color:var(--pc,var(--emerald));font-weight:500;text-decoration:none;border-bottom:1px solid transparent}
  .post .substack:hover{border-bottom-color:currentColor}
  .post .turn{display:block;margin-top:12px;font-size:13px;font-style:italic;color:var(--ink-faint)}
  .post.active .turn{display:none}

  /* ---------- Map side ---------- */
  #map{height:100vh;background:#cfe4d6;position:relative}
  .maplibregl-canvas{filter:saturate(.72) brightness(1.05) contrast(.94)}
  #map::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(143,196,232,.12),rgba(251,250,243,0) 40%);mix-blend-mode:multiply}
  .maplibregl-popup{max-width:300px!important;font-family:"Bitter",serif}
  .maplibregl-popup-content{background:var(--cloud);border:1px solid var(--line);border-radius:4px;padding:0;overflow:hidden;box-shadow:0 10px 34px rgba(31,61,46,.22)}
  .pop-img{width:100%;height:120px;object-fit:cover;display:block}
  .pop-body{padding:16px 18px}
  .pop-body .meta{font-size:11.5px;color:var(--ink-faint);margin:0 0 6px;font-weight:500}
  .pop-body .meta .place{color:var(--pc,var(--emerald));font-weight:600}
  .pop-body h3{margin:0 0 6px;font-size:18px;font-weight:600;line-height:1.15}
  .pop-body p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-soft)}
  .maplibregl-popup-tip{display:none}
  .pin{width:13px;height:13px;border-radius:50%;background:var(--pc,var(--emerald));border:2.5px solid var(--cloud);
    cursor:pointer;box-shadow:0 0 0 1px rgba(31,61,46,.25),0 2px 5px rgba(0,0,0,.3);transition:transform .16s ease,box-shadow .16s ease}
  .pin:hover{transform:scale(1.28)}
  .pin.active{transform:scale(1.18);box-shadow:0 0 0 7px color-mix(in srgb,var(--pc,var(--emerald)) 22%,transparent),0 0 0 1px var(--pc,var(--emerald)),0 2px 5px rgba(0,0,0,.3)}
  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(251,250,243,.85)!important;font-family:system-ui,sans-serif}
  .maplibregl-ctrl-group{background:var(--cloud);border:1px solid var(--line)!important;box-shadow:none!important}

  /* map toggle button — mobile only */
  .maptoggle{display:none}

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    #app{display:block;height:auto}
    #map{height:44vh;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
    #feed{overflow:visible}
    .masthead{padding:30px 24px 18px;gap:16px}
    .masthead h1{font-size:34px}
    .masthead h1 .gloss{font-size:20px}
    .portrait{width:46px;height:46px}
    .rule{margin:0 24px}
    .post{padding:24px}
    .post .excerpt,.post .body{max-width:none}
    .post h2{font-size:22px}
    /* bigger tap targets, no hover reliance */
    .post .substack{padding:4px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="feed">
    <header class="masthead">
      <div class="titles">
        <h1>Andares <span class="gloss">(wandering)</span></h1>
        <p class="byline">with Pat</p>
      </div>
      <img class="portrait" src="pat.jpg" alt="Pat, smiling, with a mountain lake behind him">
    </header>
    <div class="rule"></div>
    <ul class="posts" id="posts" aria-label="Journal entries"></ul>
  </div>
  <div id="map" role="region" aria-label="Map of journal entry locations"></div>
</div>

<script>
/* ============================================================
   POSTS — the only thing you edit to add an entry.
   Fields:
     coordinates : [longitude, latitude]  (drops the pin)
     place       : location name shown in the post
     title, date : text
     color       : a preset word (emerald, marigold, clay, coral,
                   sage) OR a raw hex like "#7a5b3a"
     excerpt     : the short teaser (always visible)
     body        : full text; wrap paragraphs in <p>…</p>
     photo       : filename of an image in the repo, or "" for none
     photoAlt    : short description of the photo (accessibility)
     substack    : full URL to the longer essay, or "" for none
   Zero, one, or several photos: to add more, put extra
   <img> tags inside the body HTML.
============================================================ */
const PRESET={emerald:"#2e7d5b",marigold:"#e0a530",clay:"#c96f3a",coral:"#d98e78",sage:"#6a9a5b",pine:"#1f3d2e"};

const posts=[
  {coordinates:[-90.4478,15.0876],place:"Salamá",title:"The town with no addresses",date:"March 4",color:"marigold",
   excerpt:"Nobody here navigates by street number. You navigate by memory — the yellow house, the second tienda, where the pavement gives out.",
   body:"<p>Nobody here navigates by street number. You navigate by memory — the yellow house past the church, the second tienda, the corner where the pavement gives out and the dust begins.</p><p>I spent a decade making maps that assume an address is a fixed truth. Here an address is a story you tell, and it changes depending on who's listening.</p>",
   photo:"",photoAlt:"",substack:""},
  {coordinates:[-90.3986,15.1123],place:"Camino a San Jerónimo",title:"Foreground, background",date:"March 19",color:"emerald",
   excerpt:"A photographer would call it middle distance — not the thing you're looking at, or the horizon behind it, but the part where life actually happens.",
   body:"<p>A photographer would call it the middle distance: not the thing right in front of the lens, not the blue horizon behind it, but the muddled band in between where the road bends and the fields start and someone is walking a dog you can't quite make out.</p><p>That's where I seem to live now. Far enough from home that it's abstract. Close enough to here that it isn't mine yet.</p>",
   photo:"",photoAlt:"",substack:""},
  {coordinates:[-90.4211,15.0654],place:"Mercado Central",title:"How a road gets named",date:"April 2",color:"clay",
   excerpt:"Back home I ran a whole policy for this. Here a road is named by whoever's lived on it longest, and the name is right because everyone agrees it is.",
   body:"<p>Back home I wrote the standards for this — a whole resolution about how a road gets a name, who signs off, which font goes on the sign.</p><p>Here a road is named by whoever has lived on it longest, and it's the correct name for exactly as long as everyone agrees it is. I keep reaching for the version of me that had authority over this. He's not useful here. It's a relief, mostly.</p>",
   photo:"",photoAlt:"",substack:""}
];

function colorOf(p){return PRESET[p.color]||p.color||"var(--emerald)";}

function init(){
  const map=new maplibregl.Map({
    container:"map",
    style:{version:8,
      sources:{osm:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap contributors"}},
      layers:[{id:"osm",type:"raster",source:"osm"}]},
    center:[-90.42,15.09],zoom:12,attributionControl:{compact:true}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");

  const markers=[];let activeIdx=null;
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  function setActive(i,{fly=true}={}){
    if(activeIdx!==null&&markers[activeIdx])markers[activeIdx].el.classList.remove("active");
    document.querySelectorAll(".post").forEach((el,j)=>el.classList.toggle("active",j===i));
    activeIdx=i;const m=markers[i];
    if(m){m.el.classList.add("active");
      if(fly&&!reduce)map.flyTo({center:m.marker.getLngLat(),zoom:14,speed:.6,curve:1.4});
      else if(fly)map.setCenter(m.marker.getLngLat());
      m.marker.togglePopup();
      markers.forEach((mk,j)=>{if(j!==i&&mk.marker.getPopup().isOpen())mk.marker.togglePopup();});}
    const card=document.querySelector('.post[data-i="'+i+'"]');if(card)card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  }

  const list=document.getElementById("posts");
  posts.forEach((p,i)=>{
    const c=colorOf(p);
    const li=document.createElement("li");li.className="post";li.dataset.i=i;
    li.style.setProperty("--pc",c);
    li.setAttribute("tabindex","0");li.setAttribute("role","button");
    li.setAttribute("aria-expanded","false");
    const photoInBody = p.photo?('<img class="photo" src="'+p.photo+'" alt="'+(p.photoAlt||"")+'">'):"";
    const substack = p.substack?('<a class="substack" href="'+p.substack+'" target="_blank" rel="noopener">a longer piece on Substack →</a>'):"";
    li.innerHTML='<p class="meta"><span class="place">'+p.place+'</span> · '+p.date+'</p>'+
      '<h2>'+p.title+'</h2>'+
      '<p class="excerpt">'+p.excerpt+'</p>'+
      '<div class="body">'+photoInBody+p.body+substack+'</div>'+
      '<span class="turn">read →</span>';
    li.addEventListener("click",()=>toggle(i));
    li.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(i);}});
    list.appendChild(li);

    const el=document.createElement("div");el.className="pin";el.style.setProperty("--pc",c);
    el.setAttribute("role","button");el.setAttribute("aria-label",p.title+", "+p.place);el.setAttribute("tabindex","0");
    const popImg=p.photo?('<img class="pop-img" src="'+p.photo+'" alt="'+(p.photoAlt||"")+'">'):"";
    const popup=new maplibregl.Popup({offset:14,closeButton:false}).setHTML(
      '<div style="--pc:'+c+'">'+popImg+'<div class="pop-body"><p class="meta"><span class="place">'+p.place+'</span> · '+p.date+'</p><h3>'+p.title+'</h3><p>'+p.excerpt+'</p></div></div>');
    const marker=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat(p.coordinates).setPopup(popup).addTo(map);
    el.addEventListener("click",e=>{e.stopPropagation();setActive(i,{fly:false});});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setActive(i,{fly:false});}});
    markers.push({el,marker});
  });

  function toggle(i){
    const card=document.querySelector('.post[data-i="'+i+'"]');
    const isOpen=card.classList.contains("active");
    if(isOpen){card.classList.remove("active");card.setAttribute("aria-expanded","false");
      if(markers[i].marker.getPopup().isOpen())markers[i].marker.togglePopup();activeIdx=null;
      markers[i].el.classList.remove("active");}
    else{setActive(i);card.setAttribute("aria-expanded","true");}
  }

  // fit map to all points
  if(posts.length){const b=new maplibregl.LngLatBounds();posts.forEach(p=>b.extend(p.coordinates));map.fitBounds(b,{padding:80,maxZoom:13,duration:0});}
}
if(window.maplibregl){init();}else{
  document.getElementById("map").innerHTML='<p style="padding:24px;font-family:sans-serif;color:#4a6353">Map still loading… if this persists, the tiles are blocked in this preview but will work once hosted.</p>';
  window.addEventListener("load",()=>{if(window.maplibregl)init();});
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andares — with Pat</title>
<meta name="description" content="Andares (wandering) — a spatial journal, with Pat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root{
    --sky:#8fc4e8;--haze:#bfe0f2;--cloud:#fbfaf3;
    --ink:#1f3d2e;--ink-soft:#4a6353;--ink-faint:#7c9184;
    --emerald:#2e7d5b;--sage:#6a9a5b;--marigold:#e0a530;--clay:#c96f3a;--coral:#d98e78;
    --water:#3a7ca5;--line:rgba(31,61,46,.14);--pc:var(--water);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Bitter",Georgia,serif;color:var(--ink);
    background:linear-gradient(#8fc4e8 0%,#bfe0f2 22%,#e4f1f4 46%,#fbfaf3 72%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--emerald);outline-offset:3px;border-radius:2px}
  #app{display:grid;grid-template-columns:minmax(400px,540px) 1fr;height:100vh}
  #feed{overflow-y:auto;position:relative;scroll-behavior:smooth}
  #map{height:100vh;background:#eae4d3;position:relative}

  .masthead{padding:44px 52px 20px}
  .masthead .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .masthead h1{margin:0;font-size:38px;font-weight:700;line-height:1.05;letter-spacing:-.015em;white-space:nowrap}
  .masthead h1 .gloss{font-weight:400;font-style:italic;font-size:23px;color:var(--emerald)}
  .byline-photo{width:96px;height:64px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 3px 12px rgba(31,61,46,.22)}
  .masthead .byline{margin:14px 0 0;font-size:15px;font-style:italic;color:var(--ink-soft)}
  .rule{height:1px;background:var(--line);margin:0 52px}

  .entry{padding:34px 52px 20px}
  .entry .meta{font-size:12.5px;letter-spacing:.04em;color:var(--ink-faint);margin:0 0 4px;font-weight:500}
  .entry .place{color:var(--water);font-weight:600;font-size:15px}
  .entry .place::before{content:"◆ ";font-size:10px;vertical-align:1.5px}
  .entry .coords{font-size:11.5px;color:var(--ink-faint);letter-spacing:.02em;margin:3px 0 0;font-variant-numeric:tabular-nums}
  .entry h2{margin:14px 0 6px;font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
  .entry .date{font-size:13px;font-style:italic;color:var(--ink-faint);margin:0 0 8px}

  .viewtoggle{display:flex;gap:0;margin:18px 0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:fit-content}
  .viewtoggle button{font-family:inherit;font-size:13px;padding:7px 15px;background:transparent;border:0;cursor:pointer;color:var(--ink-soft);transition:background .18s}
  .viewtoggle button.on{background:var(--water);color:#fff}

  .poem{padding:10px 52px 60px;font-size:18px;line-height:1.62}
  .stanza{margin:0 0 26px;padding:6px 0 6px 18px;border-left:3px solid transparent;transition:border-color .3s ease,opacity .3s ease;cursor:default}
  .poem.distributed .stanza{cursor:pointer;opacity:.55}
  .poem.distributed .stanza:hover{opacity:.85}
  .poem.distributed .stanza.here{opacity:1;border-left-color:var(--water)}
  .stanza .lines{white-space:pre-line}
  .stanza .refrain{display:block;margin-top:6px;font-style:italic;color:var(--water);font-size:16px}
  .stanza .snum{display:none}
  .poem.distributed .snum{display:inline-block;font-size:11px;color:var(--ink-faint);font-style:normal;margin-right:8px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;vertical-align:2px}

  /* map bits */
  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(251,250,243,.85)!important;font-family:system-ui,sans-serif}
  .maplibregl-ctrl-group{background:var(--cloud);border:1px solid var(--line)!important;box-shadow:none!important}
  .pin{cursor:pointer;transition:transform .18s ease}
  .pin .dot{width:15px;height:15px;border-radius:50%;background:var(--water);border:2.5px solid var(--cloud);box-shadow:0 0 0 1px rgba(31,61,46,.3),0 2px 6px rgba(0,0,0,.4)}
  .pin.sm .dot{width:11px;height:11px}
  .pin:hover{transform:scale(1.25)}
  .pin.here .dot{box-shadow:0 0 0 8px rgba(58,124,165,.22),0 0 0 1px var(--water),0 2px 6px rgba(0,0,0,.4)}
  .pin .plabel{position:absolute;left:50%;top:-9px;transform:translate(-50%,-100%);white-space:nowrap;font-family:"Bitter",serif;font-size:12px;font-weight:600;color:var(--ink);background:rgba(251,250,243,.94);padding:3px 9px;border-radius:3px;border:1px solid var(--line);box-shadow:0 3px 10px rgba(31,61,46,.18);opacity:0;transition:opacity .18s;pointer-events:none}
  .pin.here .plabel,.pin:hover .plabel{opacity:1}

  @media (max-width:820px){
    #app{display:block;height:auto}
    #map{height:42vh;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
    #feed{overflow:visible;height:auto}
    .masthead{padding:26px 22px 14px}.masthead h1{font-size:30px}.masthead h1 .gloss{font-size:19px}
    .byline-photo{width:80px;height:54px}
    .rule{margin:0 22px}.entry{padding:26px 22px 14px}.poem{padding:6px 22px 40px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <div id="feed">
    <header class="masthead">
      <div class="top">
        <h1>Andares <span class="gloss">(wandering)</span></h1>
        <img class="byline-photo" src="pat.jpg" alt="Pat outdoors, mountains and water behind him">
      </div>
      <p class="byline">with Pat</p>
    </header>
    <div class="rule"></div>

    <div class="entry">
      <p class="meta"><span class="place">Anderson Flats Provincial Park</span></p>
      <p class="coords">near South Hazelton, BC · 55°14′36.6″N 127°40′09.9″W</p>
      <h2>I yield</h2>
      <p class="date">on the Skeena, late summer</p>

      <div class="viewtoggle" role="tablist" aria-label="How to read this poem">
        <button id="btn-whole" class="on" role="tab" aria-selected="true">Whole, at one place</button>
        <button id="btn-dist" role="tab" aria-selected="false">Distributed</button>
      </div>
    </div>

    <div class="poem" id="poem"></div>
  </div>
  <div id="map" role="region" aria-label="Topographic map of Anderson Flats"></div>
</div>

<script>
const CENTER=[-127.669417,55.2435];
// The poem. In "distributed" mode each stanza gets a point tracing the poem's
// movement within this place — river, air, water, the far bank, the stones.
// (Honest: all near Anderson Flats — this demos the distributed *model*, since
//  the poem came from one place. A truly multi-location piece would carry real
//  coordinates per stanza here instead.)
const stanzas=[
  {lines:"turquoise rushing,\nwithin millenia of connected disorder.",refrain:"I see the movement",offset:[-0.004,0.0016]},
  {lines:"This morning holds ambivalence,\na subtle smallness,\nconstructed by,\ncool, damp divine.",refrain:"I feel the magnitude",offset:[-0.0018,0.0028]},
  {lines:"The fish are here,\nthe trees, the brush, the roses,\na single collective force.",refrain:"I play in the motion",offset:[0.0012,0.0009]},
  {lines:"From your world to mine,\nyour power pours into my desire\nfor entitled freedom",refrain:"I remark calmly to you",offset:[0.0026,-0.0006]},
  {lines:"im obligated to let you go,\ngasping,\nlife dangling between us.",refrain:"I yield.",offset:[0.0009,-0.0022]},
  {lines:"on the sheen of river stones\nyou disappear into the malaise,\nleaving my soul alone,\nguilty and yearning.",refrain:"I trust in that moment",offset:[-0.0016,-0.0034]}
];

function init(){
  const map=new maplibregl.Map({
    container:"map",
    style:{version:8,
      sources:{topo:{type:"raster",tiles:["https://a.tile.opentopomap.org/{z}/{x}/{y}.png","https://b.tile.opentopomap.org/{z}/{x}/{y}.png","https://c.tile.opentopomap.org/{z}/{x}/{y}.png"],tileSize:256,maxzoom:17,attribution:"© OpenTopoMap (CC-BY-SA) · © OpenStreetMap contributors"}},
      layers:[{id:"topo",type:"raster",source:"topo"}]},
    center:CENTER,zoom:13,attributionControl:{compact:true}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  const pts=stanzas.map(s=>[CENTER[0]+s.offset[0],CENTER[1]+s.offset[1]]);

  // GeoJSON: the poem's movement as a real line layer (the "thread")
  map.on("load",()=>{
    map.addSource("thread",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:pts}}});
    map.addLayer({id:"thread-line",type:"line",source:"thread",
      paint:{"line-color":"#3a7ca5","line-width":2.5,"line-dasharray":[2,1.5],"line-opacity":0}});
  });
  function setThread(on){if(map.getLayer("thread-line"))map.setPaintProperty("thread-line","line-opacity",on?0.85:0);}

  // one big pin (whole mode) + six small pins (distributed mode)
  const bigEl=document.createElement("div");bigEl.className="pin";
  bigEl.innerHTML='<div class="plabel">Anderson Flats</div><div class="dot"></div>';
  bigEl.setAttribute("role","button");bigEl.setAttribute("aria-label","Anderson Flats");bigEl.tabIndex=0;
  const bigMarker=new maplibregl.Marker({element:bigEl,anchor:"center"}).setLngLat(CENTER).addTo(map);

  const stanzaMarkers=stanzas.map((s,i)=>{
    const el=document.createElement("div");el.className="pin sm";
    el.innerHTML='<div class="plabel">'+(i+1)+'. '+s.refrain+'</div><div class="dot"></div>';
    el.setAttribute("role","button");el.setAttribute("aria-label","Stanza "+(i+1)+": "+s.refrain);el.tabIndex=0;
    const m=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat(pts[i]);
    const focus=()=>focusStanza(i);
    el.addEventListener("click",e=>{e.stopPropagation();focus();});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focus();}});
    return {el,m};
  });

  const poemEl=document.getElementById("poem");
  stanzas.forEach((s,i)=>{
    const d=document.createElement("div");d.className="stanza";d.dataset.i=i;
    d.innerHTML='<span class="snum">'+(i+1)+'</span><span class="lines">'+s.lines+'</span><span class="refrain">— '+s.refrain+'</span>';
    d.addEventListener("click",()=>{if(poemEl.classList.contains("distributed"))focusStanza(i);});
    poemEl.appendChild(d);
  });

  function focusStanza(i){
    document.querySelectorAll(".stanza").forEach((el,j)=>el.classList.toggle("here",j===i));
    stanzaMarkers.forEach((sm,j)=>sm.el.classList.toggle("here",j===i));
    if(!reduce)map.easeTo({center:pts[i],zoom:14.5,duration:650,easing:t=>t*(2-t)});
    else map.setCenter(pts[i]);
    const st=document.querySelector('.stanza[data-i="'+i+'"]');if(st)st.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
  }

  // view switching
  const btnWhole=document.getElementById("btn-whole"),btnDist=document.getElementById("btn-dist");
  function whole(){
    poemEl.classList.remove("distributed");
    btnWhole.classList.add("on");btnDist.classList.remove("on");
    btnWhole.setAttribute("aria-selected","true");btnDist.setAttribute("aria-selected","false");
    stanzaMarkers.forEach(sm=>sm.m.remove());
    bigMarker.addTo(map);bigEl.classList.add("here");
    setThread(false);
    document.querySelectorAll(".stanza").forEach(el=>el.classList.remove("here"));
    if(!reduce)map.easeTo({center:CENTER,zoom:13,duration:650,easing:t=>t*(2-t)});else map.setCenter(CENTER);
  }
  function distributed(){
    poemEl.classList.add("distributed");
    btnDist.classList.add("on");btnWhole.classList.remove("on");
    btnDist.setAttribute("aria-selected","true");btnWhole.setAttribute("aria-selected","false");
    bigMarker.remove();
    stanzaMarkers.forEach(sm=>sm.m.addTo(map));
    setThread(true);
    const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend(p));map.fitBounds(b,{padding:80,maxZoom:14,duration:reduce?0:650});
    focusStanza(0);
  }
  btnWhole.addEventListener("click",whole);
  btnDist.addEventListener("click",distributed);

  whole(); // start in whole mode
}
if(window.maplibregl){init();}else{
  document.getElementById("map").innerHTML='<p style="padding:24px;font-family:sans-serif;color:#4a6353">Map still loading… works once hosted if blocked here.</p>';
  window.addEventListener("load",()=>{if(window.maplibregl)init();});
}
</script>
</body>
</html>
